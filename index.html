<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <?!= include('style'); ?>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>家計簿Surveillance</h1>
      <!-- 統合ナビゲーションパネル（分析タブでのみ表示） -->
      <div id="analysis-nav" class="hidden">
        <div style="display: flex; justify-content: center; gap: 12px; margin-top: 16px; margin-bottom: 12px;">
          <button id="toggle-cat-btn" class="btn-primary" style="margin:0; padding:6px 24px; width:auto; border-radius:20px; border:none;">物品</button>
          <button id="toggle-store-btn" class="btn-secondary" style="margin:0; padding:6px 24px; width:auto; border-radius:20px; border:1px solid #444;">店舗</button>
        </div>
        <div id="nav-month-label" style="text-align:center; font-weight:bold; font-size:14px; color:var(--primary-color); margin-bottom: 8px;"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <button id="prev-month-btn" class="btn-secondary" style="margin: 0; width: auto; padding: 6px 16px;">＜ 前月</button>
          <button id="current-month-btn" class="btn-secondary" style="margin: 0; width: auto; padding: 6px 16px;">今月</button>
          <button id="next-month-btn" class="btn-secondary" style="margin: 0; width: auto; padding: 6px 16px;">次月 ＞</button>
        </div>
      </div>
    </header>
    
    <!-- 全画面共通のフローティングバッジ（画面中央・読込中用） -->
    <div id="floating-month-badge" class="hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(30, 30, 30, 0.95); border: 1px solid var(--primary-color); padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; color: var(--primary-color); box-shadow: 0 8px 16px rgba(0,0,0,0.6); z-index: 3000; pointer-events: none;"></div>
    
      <main class="content">
        <div id="tab-input" class="tab-content active">
        
        <section class="card">
          <h2>レシート登録</h2>
          <div class="camera-area" style="display: flex; gap: 12px;">
            <input type="file" id="receipt-camera" accept="image/*" capture="environment" class="file-input">
            <label for="receipt-camera" class="btn-primary" style="flex: 1; margin: 0;">カメラを起動</label>
            <input type="file" id="receipt-gallery" accept="image/*" class="file-input">
            <label for="receipt-gallery" class="btn-secondary" style="flex: 1; margin: 0; margin-top: 0; border: 1px solid var(--primary-color); color: var(--primary-color);">写真を選択</label>
          </div>
          <hr style="border:0; border-top:1px solid #444; margin: 16px 0;">
          <button id="batch-process-btn" class="btn-secondary" style="background-color: #00796b; border:none;">ドライブのTempから一括登録</button>
          <div style="font-size: 11px; color: #9e9e9e; margin-top: 8px;">※ドライブの「家計簿Surveillance_Temp」に保存された写真をまとめて解析します。</div>
        </section>

        <section class="card">
          <h2>サマリー</h2>
          <ul class="summary-list">
            <li>今月の支出: <span id="total-expense">¥0</span></li>
          <li>要検証リスト: <span id="waste-warning">なし</span></li>
          <li style="flex-direction: column; align-items: flex-start; margin-top: 8px;">
            <span style="margin-bottom: 4px; color: var(--text-secondary);">前回の栄養ダメ出し:</span>
            <span id="missing-nutrients" style="font-weight: normal; font-size: 14px; line-height: 1.4;">-</span>
          </li>
          </ul>
        </section>
      </div>

      <div id="tab-analysis" class="tab-content hidden">
        <section class="card">
          <h2>直近3ヶ月の支出</h2>
          <div class="chart-container">
            <canvas id="monthly-bar-chart"></canvas>
          </div>
        </section>

        <section class="card">
          <h2>支出内訳（月間）</h2>
          <div class="chart-container">
            <canvas id="category-chart"></canvas>
          </div>
        </section>
        
        <section class="card">
         <h2>買い物履歴</h2>
         <div class="calendar-grid" id="calendar-grid"></div>
        </section>
        
        <section class="card">
          <h2 style="display:flex; justify-content:space-between; align-items:center;">
            月次辛口レポート
            <button id="regenerate-report-btn" class="hidden" style="background:none; border:none; padding:0; cursor:pointer; color:var(--text-secondary);">
              <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor;"><path d="M12,18A6,6 0 0,1 6,12C6,11 6.25,10.03 6.7,9.2L5.24,7.74C4.46,8.97 4,10.43 4,12A8,8 0 0,0 12,20V23L16,19L12,15M12,4V1L8,5L12,9V6A6,6 0 0,1 18,12C18,13 17.75,13.97 17.3,14.8L18.76,16.26C19.54,15.03 20,13.57 20,12A8,8 0 0,0 12,4Z"/></svg>
            </button>
          </h2>
          <button id="generate-report-btn" class="btn-secondary">この月の辛口レポートを生成</button>
          <div id="report-content" class="report-area hidden"></div>
        </section>
      </div>
        
      <!-- レシート詳細モーダル -->
      <div id="receipt-modal" class="modal hidden">
       <div class="modal-content">
          <span id="modal-close" class="modal-close">&times;</span>
          <h3 id="modal-date"></h3>
          <div id="modal-receipt-list"></div>
        </div>
      </div>

      <!-- グラフ拡大モーダル -->
      <div id="chart-modal" class="modal hidden">
      <div class="modal-content" style="max-width: 95%; max-height: 90vh;">
        <span class="modal-close" id="chart-modal-close">&times;</span>
        <div style="height: 75vh; width: 100%; position: relative;">
          <canvas id="expanded-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- プレビュー用モーダル（背景タップ等では閉じられない仕様） -->
    <div id="preview-modal" class="modal hidden">
      <div class="modal-content" style="max-height: 90vh; display: flex; flex-direction: column;">
        <h2 style="margin-top:0;">レシートプレビュー</h2>
        <div style="flex: 1; overflow: auto; margin-bottom: 12px;">
          <img id="image-preview" src="" alt="プレビュー" style="width: 100%; border-radius: 8px; object-fit: contain;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button id="btn-analyze-now" class="btn-secondary" style="margin:0;">すぐに解析</button>
          <button id="btn-save-later" class="btn-primary" style="margin:0; background-color:#00796b; border:none;">後で解析（Tempへ保存）</button>
          <button id="btn-retake" class="btn-secondary" style="margin:0; background-color:#616161; border:none;">撮り直し</button>
        </div>
      </div>
    </div>
      
      <!-- カレンダーホバー用ツールチップ -->
      <div id="cal-tooltip" class="hidden"></div>

      <div id="tab-settings" class="tab-content hidden">
        <section class="card">
          <h2>家族構成設定</h2>
          <div id="family-settings-container"></div>
          <button id="add-family-btn" class="btn-secondary" style="margin-top: 8px;">＋ 家族を追加</button>
        </section>
        
        <section class="card">
          <h2>代替食品の調理パターン</h2>
          <div class="form-group" style="margin:0;">
            <select id="setting-cooking" class="select-input">
              <option value="no_cook">調理しないで済むもの</option>
              <option value="cook">調理するパターン</option>
            </select>
          </div>
        </section>
        
        <section class="card">
          <h2>テスト・開発用</h2>
          <button id="generate-sample-btn" class="btn-secondary">サンプルレシートデータ(5日分)生成</button>
          <button id="clear-data-btn" class="btn-secondary" style="color: #cf6679; border-color: #cf6679;">全てのデータをクリア</button>
        </section>
      </div>
    </main>
    
    <nav class="bottom-nav">
      <button class="nav-item active">入力</button>
      <button class="nav-item">分析</button>
      <button class="nav-item">設定</button>
    </nav>
    
    <!-- 追従型保存・キャンセルボタン -->
    <div id="floating-action-bar">
      <button id="cancel-settings-btn" class="btn-secondary" style="margin:0; flex:1; background:var(--surface-color);">キャンセル</button>
      <button id="save-settings-btn" class="btn-primary" style="margin:0; flex:1;">保存</button>
    </div>
  </div>
  <?!= include('script'); ?>
</body>
</html>
